version: 2
updates:
  # Maintain Rust / Cargo dependencies
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "07:00"
      timezone: "Europe/Paris"
    # Consolidate updates into a single PR rather than one PR per crate
    groups:
      cargo-dependencies:
        patterns:
          - "*"
    # Lusk : seulement les corrections (1.2.3 → 1.2.4). Les nouvelles versions majeures, et pour
    # les bibliothèques en 0.x les nouvelles versions mineures (0.47 → 0.49), changent leur façon
    # de s'utiliser : elles demandent d'adapter le code, et Dependabot ne sait pas le faire (sa
    # demande de fusion échoue alors à la compilation).
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    commit-message:
      prefix: "chore(deps)"

  # Maintain GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "07:00"
      timezone: "Europe/Paris"
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci(deps)"
